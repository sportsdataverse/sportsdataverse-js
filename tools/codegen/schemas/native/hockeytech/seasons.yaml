schema: seasons
kind: dataframe
columns:
- name: season_id
  type: character
  description: 'HockeyTech season id.'
- name: season_name
  type: character
  description: 'Full season name.'
- name: shortname
  type: character
  description: 'Short season name.'
- name: career
  type: character
  description: 'Career-stats flag.'
- name: playoff
  type: character
  description: 'Playoff-season flag.'
- name: start_date
  type: character
  description: 'Season start date.'
- name: end_date
  type: character
  description: 'Season end date.'
- name: season_yr
  type: integer
  description: 'End year of the season the row belongs to, read from its name: "2025-26", "2025/26" and "2025-2026" are 2026, "26-27" is 2027, a compact "2425" is 2025. A preseason or exhibition named with the one year it starts in belongs to the next season ("2026 Pre-season" is 2027). Null when the name holds no year.'
- name: game_type_label
  type: character
  description: 'Game type read from the season name, first match wins: "preseason" (pre-season, preseason), "playoffs" (playoff, post), "exhibition", else "regular". One-off events such as all-star games are labelled "regular" too; season resolution skips them.'
