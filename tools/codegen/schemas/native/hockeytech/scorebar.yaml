schema: scorebar
kind: dataframe
columns:
- name: id
  type: character
  description: 'HockeyTech game id, the game_id the single-game functions (hockeytech_pbp, hockeytech_game_summary) take.'
- name: season_id
  type: character
  description: 'HockeyTech season id.'
- name: league_id
  type: character
  description: 'HockeyTech league id of the game within the feed (e.g. ''1''; AHL ''4'', SJHL ''3''); not always the league_id the standings call sends.'
- name: game_number
  type: character
  description: 'Game number within the schedule.'
- name: game_letter
  type: character
  description: 'Playoff-series letter (A, B, C, ... one per series), set on every playoff game and empty on regular-season games.'
- name: game_type
  type: character
  description: 'Game type the row belongs to.'
- name: quick_score
  type: character
  description: 'Unused by the feed: ''0'' in every captured row (final and scheduled games, 17 leagues), never a score.'
- name: date
  type: character
  description: 'Game date as YYYY-MM-DD (date only, no time).'
- name: flo_core_event_id
  type: character
  description: 'FloSports core event identifier linking this game to its FloSports broadcast event record.'
- name: flo_live_event_id
  type: character
  description: 'FloSports live-stream event identifier for this game.'
- name: game_date
  type: character
  description: 'Game date.'
- name: game_date_iso8601
  type: character
  description: 'Scheduled start as an ISO 8601 date-time with UTC offset (e.g. ''2023-12-04T13:00:00-05:00'').'
- name: scheduled_time
  type: character
  description: 'Raw scheduled start time for the game as returned by the HockeyTech feed, typically in HH:MM:SS format.'
- name: scheduled_formatted_time
  type: character
  description: 'Human-readable local game start time string formatted for display (e.g., "7:00 PM ET").'
- name: timezone
  type: character
  description: 'Time zone of the scheduled start as a tz database name (e.g. ''Canada/Eastern'').'
- name: ticket_url
  type: character
  description: 'URL to the official ticketing page where fans can purchase tickets for this game.'
- name: home_id
  type: character
  description: 'HockeyTech team id of the home team (the id of hockeytech_teams, e.g. PWHL ''1'' = Boston), not an ESPN id.'
- name: home_code
  type: character
  description: 'Short team code (abbreviation) for the home team (e.g., "BOS", "MIN").'
- name: home_city
  type: character
  description: 'City name of the home team (e.g. ''Boston'', ''Minnesota'').'
- name: home_nickname
  type: character
  description: 'Franchise nickname for the home team (e.g., "Fleet", "Frost").'
- name: home_long_name
  type: character
  description: 'Full name including city and franchise for the home team (e.g., "Boston Fleet").'
- name: home_division
  type: character
  description: 'Home team division.'
- name: home_goals
  type: character
  description: 'Goals scored by the home team in the game so far; the final score once game_status is ''4''.'
- name: home_audio_url
  type: character
  description: 'URL of the home-team radio or audio broadcast stream for this game.'
- name: home_video_url
  type: character
  description: 'URL of the home-team video broadcast stream for this game.'
- name: home_webcast_url
  type: character
  description: 'URL of the home-team webcast for online viewing of this game.'
- name: visitor_id
  type: character
  description: 'HockeyTech team identifier for the visiting team in this game.'
- name: visitor_code
  type: character
  description: 'Short team code (abbreviation) for the visiting team (e.g., "NYR", "OTT").'
- name: visitor_city
  type: character
  description: 'City name of the visiting team (e.g., "New York", "Ottawa").'
- name: visitor_nickname
  type: character
  description: 'Franchise nickname for the visiting team (e.g., "Charge", "Sceptres").'
- name: visitor_long_name
  type: character
  description: 'Full name including city and franchise for the visiting team (e.g., "Ottawa Charge").'
- name: visiting_division
  type: character
  description: 'Visiting team division.'
- name: visitor_goals
  type: character
  description: 'Number of goals scored by the visiting team at the current point in the game.'
- name: visitor_audio_url
  type: character
  description: 'URL of the visiting-team radio or audio broadcast stream for this game.'
- name: visitor_video_url
  type: character
  description: 'URL of the visiting-team video broadcast stream for this game.'
- name: visitor_webcast_url
  type: character
  description: 'URL of the visiting-team webcast for online viewing of this game.'
- name: period
  type: character
  description: 'Period number.'
- name: period_name_short
  type: character
  description: 'Abbreviated name of the current or final game period (e.g., "3rd", "OT").'
- name: period_name_long
  type: character
  description: 'Verbose name of the current or final game period (e.g., "Third Period", "Overtime").'
- name: game_clock
  type: character
  description: 'Game clock.'
- name: game_summary_url
  type: character
  description: 'Game-summary link target, not a full URL: the bare game id in some leagues (e.g. PWHL ''74'') and a site-relative path in others (e.g. ''/game-center/?game_id=4896'').'
- name: home_wins
  type: character
  description: 'Home team''s wins in its record for this game''s season (season_id) as the feed reports it when fetched: the same value on every row of that team-season, not the record as of the game date.'
- name: home_regulation_losses
  type: character
  description: 'Home team''s regulation losses in its record for this game''s season (season_id) as the feed reports it when fetched: the same value on every row of that team-season, not the record as of the game date.'
- name: home_ot_losses
  type: character
  description: 'Home team''s overtime losses in its record for this game''s season (season_id) as the feed reports it when fetched: the same value on every row of that team-season, not the record as of the game date.'
- name: home_shootout_losses
  type: character
  description: 'Home team''s shootout losses in its record for this game''s season (season_id) as the feed reports it when fetched: the same value on every row of that team-season, not the record as of the game date.'
- name: visitor_wins
  type: character
  description: 'Visiting team''s wins in its record for this game''s season (season_id) as the feed reports it when fetched: the same value on every row of that team-season, not the record as of the game date.'
- name: visitor_regulation_losses
  type: character
  description: 'Visiting team''s regulation losses in its record for this game''s season (season_id) as the feed reports it when fetched: the same value on every row of that team-season, not the record as of the game date.'
- name: visitor_ot_losses
  type: character
  description: 'Visiting team''s overtime losses in its record for this game''s season (season_id) as the feed reports it when fetched: the same value on every row of that team-season, not the record as of the game date.'
- name: visitor_shootout_losses
  type: character
  description: 'Visiting team''s shootout losses in its record for this game''s season (season_id) as the feed reports it when fetched: the same value on every row of that team-season, not the record as of the game date.'
- name: game_status
  type: character
  description: 'Numeric game-status code as text: ''1'' for a scheduled game, ''4'' for a final. The label is in game_status_string (''Final'', or the start time of a scheduled game).'
- name: intermission
  type: character
  description: 'Flag or string indicating whether the game is currently in an intermission period.'
- name: game_status_string
  type: character
  description: 'Short status label for the game''s current state (e.g., "Final", "In Progress", "Scheduled").'
- name: game_status_string_long
  type: character
  description: 'Verbose status description for the game''s current state, including period or overtime context.'
- name: ord
  type: character
  description: 'Ordinal sort key used by the HockeyTech scorebar feed to order games within a day.'
- name: venue_name
  type: character
  description: 'Name of the venue.'
- name: venue_location
  type: character
  description: 'City and/or arena name indicating the physical location where the game is played.'
- name: league_name
  type: character
  description: 'League name.'
- name: league_code
  type: character
  description: 'Short code identifying the league for this scorebar record (e.g., "PWHL").'
- name: timezone_short
  type: character
  description: 'Abbreviated timezone label for the game''s scheduled start time (e.g., "ET", "CT").'
- name: home_logo
  type: character
  description: 'Home team logo URL.'
- name: visitor_logo
  type: character
  description: 'URL of the logo image for the visiting team.'
- name: flo_hockey_url
  type: character
  description: 'URL to the FloHockey streaming page for this game.'
- name: combined_client_code
  type: character
  description: 'Combined league-and-client identifier string used by the HockeyTech feed to distinguish multi-tenant deployments.'
