schema: transactions
kind: dataframe
columns:
- name: transaction_type
  type: character
  description: 'Transaction-type code (''2'' on the captured ''Signed'' rows).'
- name: title
  type: character
  description: 'Transaction title (e.g. ''Signed'').'
- name: ttype
  type: character
  description: 'Transaction category code (''1'' = ''ADD'' in the capture).'
- name: ttype_text
  type: character
  description: 'Transaction category label (e.g. ''ADD'').'
- name: transaction_date
  type: character
  description: 'Transaction date (YYYY-MM-DD).'
- name: transaction_time
  type: character
  description: 'Transaction time of day (HH:MM:SS) in `timezone`.'
- name: formatted_transaction_date
  type: character
  description: 'Transaction date formatted MM/DD/YYYY.'
- name: timezone
  type: character
  description: 'Time zone of the transaction.'
- name: player_id
  type: character
  description: 'HockeyTech player id.'
- name: response1
  type: character
  description: 'Feed response text field 1 (empty in every captured row).'
- name: response2
  type: character
  description: 'Feed response text field 2 (empty in every captured row).'
- name: first_name
  type: character
  description: 'Player first name.'
- name: last_name
  type: character
  description: 'Player last name.'
- name: player_name
  type: character
  description: 'Player name with position in parentheses (e.g. ''Neena Brick (F)'').'
- name: position
  type: character
  description: 'Player position.'
- name: team_id
  type: character
  description: 'HockeyTech team id.'
- name: team_city
  type: character
  description: 'Team city.'
- name: team_name
  type: character
  description: 'Team name.'
- name: team_code
  type: character
  description: 'Team abbreviation.'
- name: division
  type: character
  description: 'Division name (e.g. ''PWHL'').'
- name: team_logo
  type: character
  description: 'URL to the team logo image.'
- name: detail
  type: character
  description: 'Transaction detail text; may contain HTML fragments (''Signed'' in the capture).'
