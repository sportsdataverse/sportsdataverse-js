schema: player_game_log
kind: dataframe
columns:
- name: g_month
  type: character
  description: 'Month name of the game date (e.g. ''November'').'
- name: id
  type: character
  description: 'HockeyTech game id.'
- name: home_team
  type: character
  description: 'HockeyTech team id of the home team.'
- name: visiting_team
  type: character
  description: 'HockeyTech team id of the visiting team.'
- name: date_played
  type: character
  description: 'Game date (YYYY-MM-DD).'
- name: home
  type: character
  description: 'Whether the player''s team was home.'
- name: shots
  type: character
  description: 'Shots on goal.'
- name: goalie
  type: character
  description: 'Whether the player appeared as a goalie in this game (''0'' on the captured skater row).'
- name: home_team_code
  type: character
  description: 'Short team code of the home team (e.g. ''VAN'').'
- name: home_team_name
  type: character
  description: 'Full name of the home team.'
- name: home_division
  type: character
  description: 'Home team division.'
- name: visiting_team_code
  type: character
  description: 'Short team code of the visiting team (e.g. ''SEA'').'
- name: visiting_team_name
  type: character
  description: 'Full name of the visiting team.'
- name: visiting_division
  type: character
  description: 'Visiting team division.'
- name: goals
  type: character
  description: 'Goals scored.'
- name: ice_time_minutes_seconds
  type: character
  description: 'Ice time in minutes and seconds.'
- name: hits
  type: character
  description: 'Hits.'
- name: shots_blocked_by_player
  type: character
  description: 'Shots blocked by the player.'
- name: plusminus
  type: character
  description: 'Plus/minus rating (the same value as `plus_minus`).'
- name: assists
  type: character
  description: 'Assists.'
- name: shootout_goals
  type: character
  description: 'Shootout goals.'
- name: shootout_attempts
  type: character
  description: 'Shootout attempts.'
- name: shootout_goals_win
  type: character
  description: 'Shootout game-winning goals (the feed''s `shootout_goals_win`).'
- name: shootout_shots
  type: character
  description: 'Shootout shots taken.'
- name: penalty_minutes
  type: character
  description: 'Penalty minutes.'
- name: shooting_percentage
  type: character
  description: 'Shooting percentage.'
- name: shootout_shots_percentage
  type: character
  description: 'Shootout scoring percentage (shootout goals per shootout shot).'
- name: points
  type: character
  description: 'Total points (goals + assists).'
- name: player_team
  type: character
  description: 'HockeyTech team id of the player''s team in this game.'
- name: plus_minus
  type: character
  description: 'Plus/minus rating.'
- name: power_play_goals
  type: character
  description: 'Power-play goals.'
- name: short_handed_goals
  type: character
  description: 'Short-handed goals.'
- name: empty_net_goals
  type: character
  description: 'Empty-net goals.'
- name: insurange_goals
  type: character
  description: 'Insurance goals (the feed spells the key `insurange_goals`).'
- name: game_winning_goals
  type: character
  description: 'Game-winning goals.'
- name: first_goals_scored
  type: character
  description: 'First goals of a game (the feed''s `first_goals_scored`).'
- name: game_tieing_goals
  type: character
  description: 'Game-tying goals.'
- name: faceoffs_taken
  type: character
  description: 'Faceoff attempts.'
- name: faceoffs_won
  type: character
  description: 'Faceoff wins.'
