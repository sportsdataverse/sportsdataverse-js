  type: character
  description: ""
- name: quarter
  type: integer
  description: ""
- name: time_remaining
  type: character
  description: ""
- name: down
  type: integer
  description: ""
- name: distance
  type: character
  description: ""
- name: side
  type: character
  description: ""
- name: yardline
  type: integer
  description: ""
- name: team_in_possession
  type: integer
  description: ""
- name: description
  type: character
  description: ""
- name: medium
  type: character
  description: ""
- name: short
  type: character
  description: ""
- name: score_on_play
  type: logical
  description: ""
- name: score_type
  type: character
  description: ""
- name: short_score
  type: character
  description: ""
- name: under_review
  type: logical
  description: ""
