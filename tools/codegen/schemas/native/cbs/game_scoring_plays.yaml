# cbs returns schema (JS-owned): columns derived from the registered parser's rows on
# the committed real capture(s) cbs/game_scoring_plays_nfl.json, cbs/game_scoring_plays_ncaaf.json by
# tools/codegen/regen-capture-schemas.mjs. Types are inferred from the captured values;
# `description` is JS-owned text kept across regeneration (blanks fill at render time from
# sdv-py's manual_column_descriptions.yaml). Do not hand-type columns: re-run the script.
