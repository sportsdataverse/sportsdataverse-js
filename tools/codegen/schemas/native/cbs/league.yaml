# cbs returns schema (JS-owned): columns derived from the registered parser's rows on
# the committed real capture(s) cbs/league_meta_nfl.json by
# tools/codegen/regen-capture-schemas.mjs. Types are inferred from the captured values;
# `description` is JS-owned text kept across regeneration (blanks fill at render time from
# sdv-py's manual_column_descriptions.yaml). Do not hand-type columns: re-run the script.
schema: league
kind: dataframe
columns:
- name: league_id
  type: character
  description: League ID.
- name: league_abbr
  type: character
  description: League abbreviation.
- name: league_name
  type: character
  description: League name.
- name: sport_id
  type: character
  description: Sport ID.
- name: league_type
  type: character
  description: League type.
- name: teams
  type: character
  description: Teams.
- name: color_primary
  type: character
  description: Color primary.
- name: color_secondary
  type: character
  description: Color secondary.
