# One-way vendor sync: sportsdataverse-py -> sportsdataverse-js.
#
# sdv-py's codegen endpoint YAML + returns schemas are the source of truth for
# the shared families below. `tools/codegen/vendor.mjs` fetches them at
# `source.ref` into tools/codegen/vendor/upstream/ (verbatim, committed), then
# derives tools/codegen/endpoints/<family>.yaml + the schemas they reference.
#
#   npm run vendor -- --ref <sha>   # bump the pin, fetch, re-derive
#   npm run vendor -- --offline     # re-derive from the committed upstream copy
#   npm run vendor:check            # offline drift gate (CI): fails on hand-edits
#
# Never hand-edit a vendored file. JS-only endpoints and JS-side patches go in
# tools/codegen/overlay/<family>.yaml; new/changed shared endpoints land in
# sdv-py first. Fetch is GitHub raw by default, or a local sdv-py checkout via
# env SDV_PY_REPO (read with `git cat-file` at the ref, never its working tree).
#
# Per family (key = JS family = output file + `api` stem):
#   from:     py endpoint stem (default: the key)
#   names:    py short -> JS short (keeps JS public names; Task 4 flips CBS)
#   parsers:  py parser name -> {js: <JS registry name>, schema_compatible: <bool>}
#             A py parser with NO entry is the same parser ported to JS under
#             py's name. `schema_compatible: true` declares the JS parser an
#             equivalent port, so py's returns schema describes its output.
#   parser_overrides: JS short -> JS parser (JS deliberately uses a different
#             parser than py's maps to; keyed by the post-rename JS short)
#   schemas:  returns-schema path prefix rewrite, py -> JS
#
# Returns-schema policy (a returns table must describe what the JS parser
# returns): a py `returns_schema` is kept only when the endpoint's parser is
# py's name ported as-is or a `schema_compatible: true` mapping, and no
# `parser_overrides` entry applies. Otherwise it is dropped, and the family's
# overlay attaches JS's own schema where JS had one (no table beats a wrong one).
# A family with an overlay/<family>.yaml gets it merged on top.
source:
  repo: sportsdataverse/sportsdataverse-py
  ref: 719de79edb685b89c524f8b4c0c146fea0b53855

# Copied verbatim (no transform, not generated here).
copy:
  - endpoints/releases.yaml

families:
  espn_site_v2: {}
  espn_core_v2:
    parsers:
      # py-only weekly FPI parser (not ported); the Core v2 list parser stands in.
      parse_weekly_powerindex: {js: parse_items, schema_compatible: false}
  espn_web_v3: {}
  leagues: {}
  mlb_statcast: {}
  nfl_api:
    parsers:
      # py-only parsers (not ported): the generic one-row flattener stands in.
      parse_nfl_game_details_v2: {js: parse_nfl_team, schema_compatible: false}
      parse_nfl_game_details_by_slug: {js: parse_nfl_team, schema_compatible: false}
      parse_nfl_live_team_statistics: {js: parse_nfl_team, schema_compatible: false}
      parse_nfl_live_player_statistics: {js: parse_nfl_team, schema_compatible: false}
  nhl_api_web: {}
  nhl_edge: {}
  nhl_records: {}
  nhl_stats_rest: {}
  mlb:
    from: mlb_api
    # overlay/mlb.yaml: the 14 JS-only endpoints, JS's schemas for the two
    # parser_overrides below, and a `pbp` patch for sdv-py@719de79's
    # `timecode` -> `language` query-key bug. Drop that patch once the pin
    # includes the upstream sdv-py fix.
    parsers:
      # src/parsers/mlb.ts is a faithful port of sdv-py's MLB Stats parsers.
      parse_mlb_api_schedule: {js: parse_mlb_schedule, schema_compatible: true}
      parse_mlb_api_list: {js: parse_mlb_list, schema_compatible: true}
      parse_mlb_api_boxscore: {js: parse_mlb_boxscore, schema_compatible: true}
      parse_mlb_api_linescore: {js: parse_mlb_linescore, schema_compatible: true}
      parse_mlb_api_play_by_play: {js: parse_mlb_play_by_play, schema_compatible: true}
      parse_mlb_api_win_probability: {js: parse_mlb_win_probability, schema_compatible: true}
      parse_mlb_api_team_roster: {js: parse_mlb_team_roster, schema_compatible: true}
      parse_mlb_api_draft_latest: {js: parse_mlb_draft_latest, schema_compatible: true}
      parse_mlb_api_timecodes: {js: parse_mlb_timecodes, schema_compatible: true}
    parser_overrides:
      teams_stats: parse_mlb_person_stats
      team_roster_type: parse_mlb_team_roster
    schemas:
      native/mlb_api/: native/mlb/
  torvik:
    # Both py endpoints use JS's positional parsers, so JS keeps its own schemas
    # (overlay/torvik.yaml, with the 3 JS-only endpoints).
    parser_overrides:
      ratings: parse_torvik_ratings
      team_factors: parse_torvik_team_factors
  cbs:
    from: cbs_napi
    names:
      client_config: client_configuration
      division_subdivisions: sub_divisions
      game_boxscore: boxscore
      game_featured: featured_game
      game_odds_hq: game_hq_odds
      game_probable_players: probable_players
      game_ruwt_highlights: ruwt_highlights
      game_weather: weather
      player_depth_charts: depth_charts
      player_hockey_meta: hockey_player_meta
      player_meta_baseball: baseball_player_meta
      player_meta_golf: player_golf_metadata
      player_position_rankings: position_rankings
      player_recruit_associations: recruit_team_associations
      team_rankings_sportsline: sports_line_team_rankings
      team_standings_sportsline: sports_line_team_standings
    # JS's CBS parsers were written independently of sdv-py's, so py's schemas
    # don't describe them: JS keeps its own (described) schemas via overlay/cbs.yaml.
    parsers:
      parse_cbs_napi: {js: parse_cbs_list, schema_compatible: false}
      parse_cbs_napi_scoring_drives: {js: parse_cbs_list, schema_compatible: false}
      parse_cbs_napi_scoring_plays: {js: parse_cbs_list, schema_compatible: false}
      parse_cbs_napi_standings: {js: parse_cbs_standings, schema_compatible: false}
    parser_overrides:
      featured_game: parse_cbs_scoreboard
      game_scoring_scoreboard: parse_cbs_scoreboard
      game_scoring_scores: parse_cbs_scoreboard
      game_hq_odds: parse_cbs_odds
      game_odds: parse_cbs_odds
      game_props: parse_cbs_odds
      odds: parse_cbs_odds
      player_standings: parse_cbs_standings
      sports_line_team_standings: parse_cbs_standings
    schemas:
      native/cbs_napi/: native/cbs/
  yahoo:
    from: yahoo_shangrila
    # JS's Yahoo parsers were written independently of sdv-py's, so JS keeps its
    # own schemas via overlay/yahoo.yaml (the editorial routes get the
    # yahoo_scores schemas of the parsers they run through).
    parsers:
      parse_yahoo_shangrila: {js: parse_yahoo_list, schema_compatible: false}
      parse_yahoo_shangrila_tables: {js: parse_yahoo_stats, schema_compatible: false}
      parse_yahoo_editorial: {js: parse_yahoo_scores_list, schema_compatible: false}
    parser_overrides:
      game_stats_leaders: parse_yahoo_stats
      league_stats_by_team: parse_yahoo_stats
      league_stats_individual: parse_yahoo_stats
      league_stats_overview: parse_yahoo_stats
      league_stats_weekly: parse_yahoo_stats
      nav_dropdown_tray: parse_yahoo_list
      playbook_boxscore: parse_yahoo_list
      playbook_boxscore_poll: parse_yahoo_list
      playbook_team: parse_yahoo_list
      player_basic: parse_yahoo_list
      editorial_boxscore: parse_yahoo_scores_boxscore
      editorial_scoreboard: parse_yahoo_scores_scoreboard
    schemas:
      native/yahoo_shangrila/: native/yahoo/
