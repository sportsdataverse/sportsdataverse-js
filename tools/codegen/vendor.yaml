# One-way vendor sync: sportsdataverse-py -> sportsdataverse-js.
#
# sdv-py's codegen endpoint YAML + returns schemas are the source of truth for
# the shared families below. `tools/codegen/vendor.mjs` fetches them at
# `source.ref` into tools/codegen/vendor/upstream/ (verbatim, committed), then
# derives tools/codegen/endpoints/<family>.yaml + the schemas they reference.
#
#   npm run vendor -- --ref <sha>   # bump the pin, fetch, re-derive
#   npm run vendor -- --offline     # re-derive from the committed upstream copy
#   npm run vendor:check            # offline drift gate (CI): fails on hand-edits
#
# Never hand-edit a vendored file. JS-only endpoints and JS-side patches go in
# tools/codegen/overlay/<family>.yaml; new/changed shared endpoints land in
# sdv-py first. Fetch is GitHub raw by default, or a local sdv-py checkout via
# env SDV_PY_REPO (read with `git cat-file` at the ref, never its working tree).
#
# Per family (key = JS family = output file + `api` stem):
#   from:     py endpoint stem (default: the key)
#   names:    py short -> JS short. Avoid it: since v4 JS public names ARE
#             sdv-py's (tools/codegen/generate.mjs ports py's emit-time naming).
#             A pre-v4 JS name goes in the overlay as `legacy_short:` instead,
#             which keeps it callable as a deprecated alias.
#   parsers:  py parser name -> {js: <JS registry name>, schema_compatible: <bool>}
#             (every entry must match a vendored endpoint's parser). A py parser
#             with NO entry keeps its name in JS.
#   schema_compatible: true  (family) declares that the family's JS parsers are
#             faithful ports of sdv-py's, so py's returns schemas describe the
#             output of every py parser name kept as-is.
#   parser_overrides: JS short -> JS parser (JS deliberately uses a different
#             parser than py's maps to; keyed by the post-rename JS short)
#   schema_incompatible: [JS short, ...] endpoints whose py returns schema the
#             parser-parity harness (test/parsers/parity.test.js) showed does
#             not describe the parser's output on a real sdv-py capture, so it
#             is dropped although the parser is a declared-compatible port.
#   schemas:  returns-schema path prefix rewrite, py -> JS
#
# Returns-schema policy (a returns table must describe what the JS parser
# returns), fail-closed: a py `returns_schema` is kept only when compatibility
# is DECLARED (family `schema_compatible: true` for a kept py name, or a
# `parsers` entry with `schema_compatible: true`), no `parser_overrides` entry
# applies and the short is not `schema_incompatible`. Otherwise it is dropped, and the family's overlay attaches JS's
# own schema where JS had one (no table beats a wrong one).
# A family with an overlay/<family>.yaml gets it merged on top.
source:
  repo: sportsdataverse/sportsdataverse-py
  ref: 81eb7e7060de58ec79b6bdf8bbc1a797f9eb537f

# Copied verbatim (no transform, not generated here).
# espn_rename_map.yaml: sdv-py's curated ESPN renames, read by generate.mjs.
copy:
  - endpoints/releases.yaml
  - espn_rename_map.yaml

# sdv-py public names, written by hand in sdv-py at `source.ref`, that its
# emit-time rename layer treats as taken: py reads them off its own package
# (generate.py `_handwritten_espn_names` for ESPN, `reserved_names` for a flat
# family with a `qualifier`); JS can't import py, so they are listed here.
# generate.mjs then applies py's rule: a convention rename that lands on one of
# these is version-qualified (`athlete_stats` -> `player_stats_v3`), and a flat
# `{prefix}_{short}` that lands on one gets the family qualifier
# (`nhl_pbp` -> `nhl_web_pbp`). Only names that change a JS name belong here.
# test/naming.test.js compares JS names against sdv-py's generated names at the
# pin (tools/codegen/py_public_names.json, derived by `npm run vendor` from the
# verbatim py modules in vendor/upstream/py/); a pin bump that adds a collision
# fails that test until the name is added here.
py_reserved:
  - espn_cfb_player_stats
  - espn_mbb_player_stats
  - espn_mlb_player_stats
  - espn_nba_player_stats
  - espn_nfl_player_stats
  - espn_nhl_player_stats
  - espn_wbb_player_stats
  - espn_wnba_player_stats
  - nhl_pbp
  - nhl_schedule

families:
  # ESPN: no schema_compatible declaration (the JS generator renders ESPN returns
  # tables from schemas/espn/<parser>.yaml, not from the YAML returns_schema).
  espn_site_v2: {}
  espn_core_v2:
    parsers:
      # py-only weekly FPI parser (not ported); the Core v2 list parser stands in.
      parse_weekly_powerindex: {js: parse_items, schema_compatible: false}
  espn_web_v3: {}
  # ESPN FPI (fitt v3): a 5th ESPN host family (HOSTS.fitt_v3). Its `fpi` wrapper is
  # universal-scope, so it lands on every league. `parse_fpi` is registered in
  # src/parsers/espn.ts (a faithful port of sdv-py's); ESPN returns tables come
  # from schemas/espn/, so the YAML returns_schema is not used.
  espn_fitt_v3: {}
  # ESPN CDN (cdn.espn.com/core/{league}/{page}?xhr=1): espn.com's own page data,
  # a 6th ESPN host family (HOSTS.cdn). Each endpoint carries sdv-py's live-probed
  # `include_prefixes` league allowlist and the family-level `fixed_params`
  # (xhr: 1), both honoured by generate.mjs. The CDN parsers in
  # src/parsers/espn.ts are ports of sdv-py's (parse_cdn_game runs parse_summary,
  # schedule/scoreboard run parse_scoreboard); ESPN returns tables come from
  # schemas/espn/, so the YAML returns_schema is not used.
  espn_cdn: {}
  # Keyless providers / native league APIs that exist only in sdv-py.
  on3:
    # src/parsers/on3.ts: faithful port of sdv-py cfb/on3_parsers.py parse_on3_rdb
    # (the 4 deprecated _next/data scrape shims are not in the YAML and not ported).
    # py's returns tables are NOT attached (fail-closed, wholesale): they are
    # json_normalize schemas of other captures (a nested object null there is one
    # `character` column; populated, it flattens to <name>_*), and every real RDB
    # capture the parser-parity harness (test/parsers/parity.test.js) checks
    # disproves its table although JS == py cell for cell: player_profile (207
    # columns parsed vs 47 documented, 8 documented null-object columns flattened,
    # 4 `character` columns holding numbers/booleans), player_all_rankings
    # (documented `change` absent), team_ranking_team_rankings (23 of 50 columns
    # documented). Upstream follow-up: sdv-py regenerates these schemas from parser
    # output; the pin bump that ships it flips this back, gated by the harness.
    schema_compatible: false
  asa:
    # src/parsers/asa.ts: faithful port of sdv-py soccer/asa_parsers.py. The
    # multi-table goals-added parser returns py's documented default sub-frame
    # (`summary`) under `parsed: true`; `section: "actions"` selects the other.
    schema_compatible: true
  mls_api:
    # src/parsers/mls_api.ts: faithful port of sdv-py soccer/mls/mls_api_parsers.py.
    # A multi-table parser returns the sub-frame py's schema documents by default
    # (standings -> entries, match -> match_information); `section` selects the others.
    schema_compatible: true
  nwsl_api:
    # src/parsers/nwsl_api.ts: faithful port of sdv-py soccer/nwsl/nwsl_api_parsers.py;
    # lineups returns the `players` sub-frame py's schema documents by default
    # (`section`: teams | staff for the others).
    schema_compatible: true
    # Parity harness: 9 documented columns (matches_played, win, draw, lose, goals_for,
    # goals_against, goal_difference, movement, form) are absent from both parses of
    # the real standings capture.
    schema_incompatible: [standings]
  bart_wbb:
    # Women's T-Rank: the same header-CSV parse as men's, run through JS's
    # parse_torvik_ratings. Its de-duplicated header names differ from py's
    # (`rank_1` vs `rank_2` for the repeated `rank` column), so py's returns
    # schema does not describe the JS output: no returns table.
    parsers:
      parse_torvik_csv: {js: parse_torvik_ratings, schema_compatible: false}
  leagues: {}
  mlb_statcast:
    # src/parsers/mlb_statcast.ts: "Faithful port of" sdv-py's mlb_statcast_parsers.py
    schema_compatible: true
    # Parity harness on sdv-py's real captures (JS == py cell for cell):
    schema_incompatible:
      # /gf: 9 documented batted-ball columns (hit_speed, launch_speed, launch_angle,
      # xba, ...) are absent from both parses; 34 `character` columns (year, inning,
      # outs, strikes, ...) hold numbers in both.
      - gamefeed
      # other_calledstr_pct, other_pbwp100, other_csaa100 documented `character`;
      # both parses read them as numbers (py Float64).
      - leaderboard_catcher_stance
  nfl_api:
    # src/parsers/nfl_api.ts: "Faithful port of" sdv-py's nfl/nfl_api_parsers.py
    schema_compatible: true
    parsers:
      # py-only parsers (not ported): the generic one-row flattener stands in.
      parse_nfl_game_details_v2: {js: parse_nfl_team, schema_compatible: false}
      parse_nfl_game_details_by_slug: {js: parse_nfl_team, schema_compatible: false}
      parse_nfl_live_team_statistics: {js: parse_nfl_team, schema_compatible: false}
      parse_nfl_live_player_statistics: {js: parse_nfl_team, schema_compatible: false}
  nhl_api_web:
    # src/parsers/nhl_api_web.ts: "Faithful port of" sdv-py's nhl/nhl_api_web_parsers.py
    schema_compatible: true
  nhl_edge:
    # src/parsers/nhl_edge.ts: "Faithful port of" sdv-py's nhl/nhl_edge_parsers.py
    schema_compatible: true
  nhl_records:
    # src/parsers/nhl_records.ts: "Faithful port of" sdv-py's nhl/nhl_records_parsers.py
    schema_compatible: true
  nhl_stats_rest:
    # src/parsers/nhl_stats_rest.ts: "Faithful port of" sdv-py's nhl/nhl_stats_rest_parsers.py
    schema_compatible: true
  mlb:
    from: mlb_api
    # overlay/mlb.yaml: the 14 JS-only endpoints and JS's schemas for the two
    # parser_overrides below.
    parsers:
      # src/parsers/mlb.ts: "Faithful port of" sdv-py's MLB Stats parsers (mlb_parsers.py,
      # since renamed mlb_api_parsers.py); every py parser is mapped explicitly.
      parse_mlb_api_schedule: {js: parse_mlb_schedule, schema_compatible: true}
      parse_mlb_api_list: {js: parse_mlb_list, schema_compatible: true}
      parse_mlb_api_boxscore: {js: parse_mlb_boxscore, schema_compatible: true}
      parse_mlb_api_linescore: {js: parse_mlb_linescore, schema_compatible: true}
      parse_mlb_api_play_by_play: {js: parse_mlb_play_by_play, schema_compatible: true}
      parse_mlb_api_win_probability: {js: parse_mlb_win_probability, schema_compatible: true}
      parse_mlb_api_team_roster: {js: parse_mlb_team_roster, schema_compatible: true}
      parse_mlb_api_draft_latest: {js: parse_mlb_draft_latest, schema_compatible: true}
      parse_mlb_api_timecodes: {js: parse_mlb_timecodes, schema_compatible: true}
    parser_overrides:
      teams_stats: parse_mlb_person_stats
      team_roster_type: parse_mlb_team_roster
    schemas:
      native/mlb_api/: native/mlb/
  sports247:
    # 247Sports RDB (ipa.247sports.com) — the supported 247 surface; supersedes
    # the JS-owned `recruiting` family (api.247sports.com, HTTP 500).
    # src/parsers/sports247.ts: "Faithful port of" sdv-py's cfb/sports247_parsers.py
    schema_compatible: true
  sports247_site_pages:
    # 247sports.com `*.json` page models. src/parsers/sports247.ts is a faithful
    # port of sdv-py's cfb/sports247_site_pages_parsers.py. sdv-py #682 rebuilt
    # native/sports247_site_pages from that parser's output on the committed
    # captures (the 719de79 schemas typed numeric columns `character`), so they are
    # attached; test/parsers/sports247.test.js checks the NAMES and TYPES of every
    # attached schema on all 35 real captures.
    schema_compatible: true
  torvik:
    # ratings + team_factors use JS's positional parsers; game_stats /
    # player_stats / game_schedule (vendored since sdv-py #678) keep py's parser
    # names but JS's hoopR ports, which py's tables do not describe (undeclared).
    # JS keeps its own schemas for all five (overlay/torvik.yaml).
    parser_overrides:
      ratings: parse_torvik_ratings
      team_factors: parse_torvik_team_factors
  cbs:
    from: cbs_napi
    # v4: CBS uses sdv-py's short names. The 16 names JS shipped before
    # (cbs_boxscore, cbs_client_configuration, ...) are `legacy_short:` entries
    # in overlay/cbs.yaml and stay callable as deprecated aliases.
    # JS's CBS parsers were written independently of sdv-py's, so py's schemas
    # don't describe them: JS keeps its own (described) schemas via overlay/cbs.yaml.
    parsers:
      parse_cbs_napi: {js: parse_cbs_list, schema_compatible: false}
      parse_cbs_napi_scoring_drives: {js: parse_cbs_list, schema_compatible: false}
      parse_cbs_napi_scoring_plays: {js: parse_cbs_list, schema_compatible: false}
      parse_cbs_napi_standings: {js: parse_cbs_standings, schema_compatible: false}
    parser_overrides:
      game_featured: parse_cbs_scoreboard
      game_scoring_scoreboard: parse_cbs_scoreboard
      game_scoring_scores: parse_cbs_scoreboard
      game_odds_hq: parse_cbs_odds
      game_odds: parse_cbs_odds
      game_props: parse_cbs_odds
      odds: parse_cbs_odds
      player_standings: parse_cbs_standings
      team_standings_sportsline: parse_cbs_standings
    schemas:
      native/cbs_napi/: native/cbs/
  yahoo:
    from: yahoo_shangrila
    # JS's Yahoo parsers were written independently of sdv-py's, so JS keeps its
    # own schemas via overlay/yahoo.yaml (the editorial routes get the
    # yahoo_scores schemas of the parsers they run through).
    parsers:
      parse_yahoo_shangrila: {js: parse_yahoo_list, schema_compatible: false}
      parse_yahoo_shangrila_tables: {js: parse_yahoo_stats, schema_compatible: false}
      parse_yahoo_editorial: {js: parse_yahoo_scores_list, schema_compatible: false}
    parser_overrides:
      game_stats_leaders: parse_yahoo_stats
      league_stats_by_team: parse_yahoo_stats
      league_stats_individual: parse_yahoo_stats
      league_stats_overview: parse_yahoo_stats
      league_stats_weekly: parse_yahoo_stats
      nav_dropdown_tray: parse_yahoo_list
      playbook_boxscore: parse_yahoo_list
      playbook_boxscore_poll: parse_yahoo_list
      playbook_team: parse_yahoo_list
      player_basic: parse_yahoo_list
      editorial_boxscore: parse_yahoo_scores_boxscore
      editorial_scoreboard: parse_yahoo_scores_scoreboard
    schemas:
      native/yahoo_shangrila/: native/yahoo/
  # Subscription families (auth-gated; never on the docs playground allowlist).
  pff_api:
    # src/parsers/pff_api.ts: faithful port of sdv-py's nfl/pff_parsers.py
    # (parse_pff_report / parse_pff_player_detail / parse_pff_v2_table), so py's
    # returns schemas describe the JS output. Runtime: src/core/pff_api_runtime.ts.
    schema_compatible: true
  kenpom:
    # src/parsers/kenpom.ts: faithful port of sdv-py's parse_kenpom_page (+ the
    # pandas.read_html header rules of _html_tables.py). py ships no returns
    # schemas for this family. Runtime: src/core/kenpom_runtime.ts.
  nfl_pro:
    # JS stem `nfl_pro` (py api stem `nflpro`) so the public names match py's
    # name_pattern nfl_pro_{short} (nfl_pro_players_offense_passing_season).
    from: nflpro
    # src/parsers/nfl_pro.ts: faithful port of sdv-py's nfl/nflpro_parsers.py.
    # Runtime: src/core/nfl_pro_runtime.ts.
    schema_compatible: true
  nba_stats:
    # src/parsers/nba_stats.ts: "Faithful port of" sdv-py's nba/nba_stats_parsers.py
    # (parse_nba_stats_result_sets: resultSets / resultSet / shot-location grouped
    # headers / scoreboardv3 / scheduleleaguev2 / boxscore *v3 / video envelopes).
    # py's returns tables are NOT attached (fail-closed, wholesale): sdv-py builds
    # them from the endpoint catalog (tools/codegen/gen_nba_stats.py), not from the
    # parser. On sdv-py's real captures the parser-parity harness
    # (test/parsers/parity.test.js) disproves 11 of the 13 tables it can check
    # although JS == py cell for cell: catalog `fg3m` / `fg3a` / `leagueid` /
    # `5-9_ft_fgm` vs parsed `fg3_m` / `fg3_a` / `league_id` / `5_9_ft_fgm`;
    # PtMeasureType-dependent columns (leaguedashptstats); multi-result-set payloads
    # parsed to {set: rows}, not the one documented frame. ~69 of the remaining
    # tables carry the same catalog names. Upstream follow-up: sdv-py regenerates
    # these schemas from parser output; the pin bump that ships it flips this back,
    # gated by the harness.
    schema_compatible: false
  wnba_stats:
    # sdv-py's parse_wnba_stats_result_sets is a re-export alias of the NBA parser,
    # so the WNBA family runs the same ported JS parser. Its py returns tables are
    # NOT attached, for the reason given under nba_stats: the harness disproves all
    # 8 it can check (fg3m vs fg3_m; `if_necessary` documented `character` where the
    # WNBA capture ships booleans; multi-result-set payloads), and ~61 of the rest
    # carry the same catalog names. Re-enabled with the upstream schema regeneration.
    parsers:
      parse_wnba_stats_result_sets: {js: parse_nba_stats_result_sets, schema_compatible: false}
