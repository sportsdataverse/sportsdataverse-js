# JS-owned patches merged on top of the VENDORED `torvik` family
# (sdv-py tools/codegen/endpoints/torvik.yaml). See tools/codegen/vendor.yaml.
# Edit here, then `npm run vendor -- --offline`.
endpoints:
# Patches: sdv-py's ratings + team_factors run through JS's positional parsers
# here (vendor.yaml parser_overrides), so they keep JS's own schemas.
- short: ratings
  returns_schema: native/torvik/ratings
- short: team_factors
  returns_schema: native/torvik/team_factors
# game_stats / player_stats / game_schedule are vendored since sdv-py #678. JS's
# parsers (ported from hoopR's torvik_*.R, src/parsers/torvik.ts) are not ports
# of sdv-py's, which add derived columns (`game_date`; `year` on the schedule),
# so py's tables are undeclared (dropped) and JS keeps its own.
- short: game_stats
  returns_schema: native/torvik/game_stats
- short: player_stats
  returns_schema: native/torvik/player_stats
- short: game_schedule
  returns_schema: native/torvik/game_schedule
