# JS-owned patches merged on top of the VENDORED `yahoo` family
# (sdv-py tools/codegen/endpoints/yahoo_shangrila.yaml). See tools/codegen/vendor.yaml.
#
# JS's Yahoo parsers were written independently of sdv-py's, so sdv-py's returns
# schemas don't describe their output (vendor.yaml declares the parser mappings
# schema_compatible: false). Each endpoint keeps the JS-owned schema it had
# before vendoring (tools/codegen/schemas/native/yahoo/, not vendored); the two
# editorial routes run through the yahoo_scores parsers, so they take those
# parsers' schemas. Edit here, then `npm run vendor -- --offline`.
