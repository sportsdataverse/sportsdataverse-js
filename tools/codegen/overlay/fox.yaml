# JS-owned patches and additions merged on top of the VENDORED `fox` family
# (sdv-py tools/codegen/endpoints/fox_api.yaml). See tools/codegen/vendor.yaml.
# Edit here, then `npm run vendor -- --offline`.
#
# Public names are sdv-py's (`fox_api_<short>`). The pre-v4 `fox_<short>` names
# stay callable as deprecated aliases (tools/codegen/pre_v4_names.json).
endpoints:
# ---------------------------------------------------------------------------
# JS's returns tables. They describe JS's own Fox parsers (src/parsers/fox.ts),
# which vendor.yaml maps py's parse_fox_api_* parsers to. sdv-py ships no fox_api
# returns schemas.
# ---------------------------------------------------------------------------
- short: scoreboard
  returns_schema: native/fox/scoreboard
- short: scorechip
  returns_schema: native/fox/scorechip
- short: topevents_scoreboard_segment
