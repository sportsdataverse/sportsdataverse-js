- short: league_scores_segment
  returns_schema: native/fox/league_scores_segment
- short: league_standings
  returns_schema: native/fox/league_standings
- short: league_stats
  returns_schema: native/fox/league_stats
- short: league_stats_con
  returns_schema: native/fox/league_stats_con
- short: league_teamnav
  returns_schema: native/fox/league_teamnav
- short: event_data
  returns_schema: native/fox/event_data
- short: event_matchup
