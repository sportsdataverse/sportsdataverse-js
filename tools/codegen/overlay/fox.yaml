# ---------------------------------------------------------------------------
# DEPRECATED, JS-only. sdv-py dropped these five as dead (see the probe record
# at the top of its tools/codegen/endpoints/fox_api.yaml, 2026-10-05, with
# same-run 200 controls). JS keeps them callable under their pre-v4 names
# (`public_name`, no new fox_api_* name is invented); each warns once. They are
# removed in a future major.
# ---------------------------------------------------------------------------
- short: explore_favorite
  public_name: fox_explore_favorite
  path: /bifrost/v1/explore/favorite/{section}/main
  parser: parse_fox_list
  returns_schema: native/fox/explore_favorite
  path_params:
  - {name: section, required: true}
  extra_params:
  - {name: apikey, query_key: apikey, default: jE7yBJVRNAwdDesMgTzTXUUSx1It41Fq}
  - {name: api_version, query_key: api-version, default: '1.1'}
  deprecated: "Fox never returned data for this route (sdv-py probe 2026-10-05: 400 for sports/players, 404 for nfl/cfb/teams, with ids/sections taken from a live explore/browse payload); sdv-py dropped it from fox_api (probe record: tools/codegen/endpoints/fox_api.yaml). Use fox_api_explore_browse()."
- short: fs_feed
  public_name: fox_fs_feed
  path: /fs/feed
  parser: parse_fox_list
  returns_schema: native/fox/fs_feed
  extra_params:
  - {name: apikey, query_key: apikey, default: SuNgfBgmTGS2xozZbnV6FcjGGRQrR8cg}
  - {name: api_version, query_key: api-version, default: '1.1'}
  deprecated: "Fox answers 404 (fault: Unable to identify proxy for host: secure) for /fs/feed with both the data and the feed key (sdv-py probe 2026-10-05); sdv-py dropped it from fox_api (probe record: tools/codegen/endpoints/fox_api.yaml)."
- short: fs_images
