# JS-owned patches merged on top of the VENDORED `cbs` family
# (sdv-py tools/codegen/endpoints/cbs_napi.yaml). See tools/codegen/vendor.yaml.
#
# JS's CBS parsers were written independently of sdv-py's, so sdv-py's returns
# schemas don't describe their output (vendor.yaml declares the parser mappings
# schema_compatible: false). Each endpoint keeps the JS-owned, described schema
# it had before vendoring (tools/codegen/schemas/native/cbs/, not vendored).
# Edit here, then `npm run vendor -- --offline`.
