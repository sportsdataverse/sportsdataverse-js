# Weekly live-API drift detector: runs the SDV_LIVE-gated suites against the real
# providers and keeps ONE open `live-tests:drift` issue current on failure.
name: Live smoke

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # a hung provider must not hold the default 6 h
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Live tests
        id: live
        timeout-minutes: 25 # a hang fails this step, so it reaches the drift issue (a job timeout would not)
        run: SDV_LIVE=1 npm test
      # Only a failing LIVE step is drift. A failure before it (install, build) is a
      # broken checkout, not an upstream change: labelled separately.
      - name: Open or update the drift issue
        if: failure() && steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create --repo "$GITHUB_REPOSITORY" live-tests:drift --color B60205 --description "Weekly live smoke detected upstream drift" 2>/dev/null || true
          body="Live smoke failed: $RUN_URL"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label live-tests:drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label live-tests:drift --title "Live smoke: upstream drift detected" --body "$body"
          fi
      - name: Open or update the build-failure issue
        if: failure() && steps.live.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create --repo "$GITHUB_REPOSITORY" live-tests:build-failure --color D93F0B --description "Weekly live smoke could not run (install/build failed): not drift" 2>/dev/null || true
          body="Live smoke could not run: install/build failed before the live tests (not upstream drift): $RUN_URL"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label live-tests:build-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label live-tests:build-failure --title "Live smoke: build failed (not drift)" --body "$body"
          fi
