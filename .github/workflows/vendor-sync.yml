name: Vendor sync (sdv-py)

# Weekly: bump the pinned sdv-py ref in tools/codegen/vendor.yaml to sdv-py
# `main` HEAD, re-vendor the shared endpoint YAML + schemas, regenerate, test,
# and open (or update) ONE sync PR. The diff is what sdv-py changed; a failing
# test is reported in the PR body rather than blocking it (a py parser name with
# no JS mapping, say, needs a vendor.yaml entry — a human call). A ref/vendor/
# codegen failure (or a LOCK mismatch against sdv-py's tree) opens or updates one issue.
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "sdv-py commit sha to vendor (default: main HEAD)"
        required: false

# No workflow-wide grant: each job asks for exactly what it needs. `actions: write`
# (dispatching CI) lives on the separate `dispatch-ci` job ONLY, because the sync job
# runs upstream-generated code and installed npm deps with a contents:write token; a
# token that could also dispatch workflows could start npm-publish.yml.
permissions: {}

concurrency:
  group: vendor-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      op: ${{ steps.cpr.outputs.pull-request-operation }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          # create-pull-request authenticates with its own token input; don't
          # leave the job token in .git/config for the npm scripts to read.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Resolve the sdv-py ref
        id: ref
        continue-on-error: true # a failure is reported by "Report sync failure"
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          sha="${INPUT_REF:-$(git ls-remote https://github.com/sportsdataverse/sportsdataverse-py refs/heads/main | cut -f1)}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "not a full commit sha: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:10}" >> "$GITHUB_OUTPUT"
      # Only this step sees GITHUB_TOKEN (API rate limit for the tree fetch).
      - name: Vendor (fetch + online LOCK check)
        id: vendor
        if: steps.ref.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15 # a hang becomes a step failure that reaches the report step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.ref.outputs.sha }}
          SDV_VENDOR_WARNINGS: vendor-warnings.txt # masked overlay patches, shown in the PR body
        run: |
          npm run vendor -- --ref "$SHA"
          npm run vendor:check:online
      - name: Regenerate
        id: codegen
        if: steps.vendor.outcome == 'success'
        continue-on-error: true
        run: npm run codegen
      - name: Report sync failure
        if: always() && (steps.ref.outcome == 'failure' || steps.vendor.outcome == 'failure' || steps.codegen.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VENDOR_OUTCOME: ${{ steps.vendor.outcome }}
          SHA: ${{ steps.ref.outputs.sha }}
          CODEGEN_OUTCOME: ${{ steps.codegen.outcome }}
        run: |
          failed="resolve ref"
          [ "$VENDOR_OUTCOME" = failure ] && failed="vendor (fetch / LOCK check)"
          [ "$CODEGEN_OUTCOME" = failure ] && failed="codegen"
          title="vendor-sync failed"
          body="The weekly vendor sync failed at: $failed. sdv-py sha: ${SHA:-not resolved}. $RUN_URL"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
          exit 1 # keep the run red as well; the issue is the durable record
      # parity_coverage.json records the vendored sdv-py ref and the per-family coverage
      # counts, so every sync changes it. Rewrite it here so the PR carries that diff for
      # review instead of failing the staleness test. A coverage error still fails the
      # Test step below and reaches the PR body.
      - name: Refresh parity coverage
        if: steps.codegen.outcome == 'success'
        continue-on-error: true
        env:
          SDV_PARITY_WRITE: "1"
        run: | # the parity test imports dist/, so build first
          npm run build
          npx mocha --timeout 15000 test/parsers/parity.test.js --grep "parity_coverage.json is current"
      - name: Test
        id: test
        if: steps.codegen.outcome == 'success'
        continue-on-error: true
        # Explicit `shell: bash` runs `bash --noprofile --norc -eo pipefail`; the
        # default (`bash -e`) has no pipefail, so a failing `npm test` piped into
        # `tail` would pass. With pipefail the step fails, `steps.test.outcome` is
        # `failure` (continue-on-error keeps the job going), and the PR body says so.
        shell: bash
        run: |
          npm run build
          npm test 2>&1 | tail -n 60 > test-summary.txt
      - name: Build PR body
        if: steps.codegen.outcome == 'success'
        env:
          SHA: ${{ steps.ref.outputs.sha }}
          OUTCOME: ${{ steps.test.outcome }}
        run: |
          {
            echo "Automated weekly sync of the vendored sdv-py codegen YAML + returns schemas"
            echo "to sportsdataverse-py@$SHA (\`npm run vendor\` + \`npm run codegen\`)."
            echo
            echo "**npm test:** $OUTCOME"
            echo
            echo "A failure usually means sdv-py added a parser name or endpoint that needs a"
            echo "\`tools/codegen/vendor.yaml\` mapping or an \`overlay/\` entry. PRs opened by"
            echo "GITHUB_TOKEN start no pull_request run, so CI was dispatched on the branch"
            echo "(`workflow_dispatch`): its checks attach to the branch head."
            echo
            if [ -s vendor-warnings.txt ]; then
              echo "**Overlay patches masking upstream changes (review):**"
              echo
              cat vendor-warnings.txt
              echo
              { echo "### vendor warnings"; cat vendor-warnings.txt; } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo '<details><summary>npm test (tail)</summary>'
            echo
            echo '```'
            cat test-summary.txt 2>/dev/null || true
            echo '```'
            echo '</details>'
          } > pr-body.md
      - id: cpr
        if: steps.codegen.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: chore/vendor-sync
          delete-branch: true
          commit-message: "chore(vendor): sync sdv-py codegen YAML to ${{ steps.ref.outputs.short }}"
          title: "chore(vendor): sync sdv-py codegen YAML to ${{ steps.ref.outputs.short }}"
          body-path: pr-body.md
          add-paths: |
            tools/codegen/**
            src/generated/**
            docs/docs/**
            docs/src/generated/**
            docs/src/playground/endpoints.json
            test/fixtures/py/parity_coverage.json

  # A PR opened/updated with GITHUB_TOKEN starts no pull_request run, but
  # workflow_dispatch is exempt, so dispatch CI on the branch (its check runs attach to
  # the branch head, so they show on the PR). Its own job on a fresh VM: no checkout, no
  # npm, no upstream-generated code, and the only token anywhere with `actions: write`.
  dispatch-ci:
    needs: sync
    if: needs.sync.outputs.op == 'created' || needs.sync.outputs.op == 'updated'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run CI on the sync branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref chore/vendor-sync
