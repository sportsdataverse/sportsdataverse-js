name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Events made with the default GITHUB_TOKEN (the vendor-sync PR) never start a
  # pull_request run; workflow_dispatch is exempt, so vendor-sync dispatches this.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build + typecheck (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # cheerio 1.2 (via undici 7) requires Node >= 20.18.1
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # `npm ci` runs the `prepare` script, which compiles src -> dist via tsc
      - run: npm ci
      # Vendored sdv-py endpoint YAML + schemas must re-derive byte-for-byte
      # from tools/codegen/vendor/upstream (offline) — catches hand-edits.
      - name: Vendor drift check
        run: npm run vendor:check
      # Online: every LOCK blob sha must equal sdv-py's git tree at the pinned ref,
      # which the offline gate cannot prove (a copy and its LOCK line edited together
      # pass it). Unreachable GitHub = failure to verify = red.
      - name: Vendor LOCK online check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run vendor:check:online
      - name: Codegen drift check
        run: npm run codegen:check
      - name: Type-check
        run: npm run typecheck
      # The root build is `strict: true` (T18b-2); tsconfig.strict.json extends it
      # unchanged, so this re-checks that the two stay equal.
      - name: Strict type-check
        run: npm run typecheck:strict
      # Public API reports (API Extractor): dist/*.d.ts must match the committed
      # etc/*.api.md. After an intended API change: `npm run api:report` + commit.
      - name: API report check
        run: npm run api:check
      # Lint the published artifact: `npm pack`, then @arethetypeswrong/cli and
      # publint against that tarball (exports map, types conditions, resolution).
      - name: Package check (attw + publint on the packed tarball)
        run: npm run pack:check
      - name: Verify the build output exists
        run: |
          node -e "import('./dist/index.js').then(m => { const s = Object.keys(m.default); if (s.length < 29 || !s.includes('nba') || !s.includes('soccer')) { throw new Error('unexpected namespaces ' + s.length); } console.log('OK', s.length, 'namespaces'); })"
      # No-network suite: contract tests for every generated wrapper + core +
      # legacy surface + playground resolver/proxy. Live-API suites are gated
      # behind SDV_LIVE (not set here), so this stays deterministic.
      - name: Test
        run: npm test

  docs:
    name: docs build (Docusaurus + TypeDoc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5 # v4
        with:
          node-version: 20.x
          cache: npm
          # Both installs run in this job (root for TypeDoc's src resolution, docs
          # for Docusaurus), so key the cache on both lockfiles.
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      # Root deps so docusaurus-plugin-typedoc can resolve the package's src imports.
      - run: npm ci
      # Drift gate: the guides carry build-time "frozen" parser-output tables
      # (tools/docs/inject-outputs.mjs, manifest in tools/docs/examples.mjs).
      # `--check` re-runs every example through the committed parser bundle and
      # fails if any guide's injected block is stale vs a fresh run, so the
      # frozen outputs can never silently drift from the parsers. Regenerate
      # locally with `npm run docs:examples` and commit the result.
      - name: Docs example-output drift check
        run: npm run docs:examples:check
      - run: npm ci
        working-directory: docs
      # Builds the Docusaurus site (generates the TypeDoc API reference) and fails
      # on any broken link (onBrokenLinks: 'throw').
      - run: npm run build
        working-directory: docs
