# Publishes the package to npm when a GitHub release is created (or on manual
# dispatch). The build job validates the package on every supported Node before
# the publish job runs (publish `needs: build`).
# https://docs.github.com/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run codegen:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + automatic provenance
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # Trusted publishing (https://docs.npmjs.com/trusted-publishers) needs Node >= 22.14 and npm >= 11.5.1,
      # and no package cache in a release build. No token: the publisher configured on npmjs.com for this
      # workflow file authenticates over OIDC, which also satisfies the package's 2FA rule a token cannot (EOTP).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm publish --access public
