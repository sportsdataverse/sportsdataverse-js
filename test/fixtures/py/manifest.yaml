# Parser-parity manifest: real sdv-py captures -> the vendored endpoint whose
# py returns schema each one verifies. test/parsers/parity.test.js runs the
# endpoint's JS parser on the capture and checks it against that schema (every
# column present, runtime types agree) and against sdv-py's own output on the
# same bytes (py/oracle/<family>.json, from tools/parity/py_oracle.py).
#
#   <family>:                      # tools/codegen/vendor.yaml family key
#     <path under test/fixtures/>: <JS endpoint short>
#
# An endpoint listed here is VERIFIED (the gate generated row types key on);
# a declared-compatible endpoint with no entry is unverified. *.gz files are the
# sdv-py capture gzipped verbatim (byte-identical after gunzip); provenance in
# py/README.md.
